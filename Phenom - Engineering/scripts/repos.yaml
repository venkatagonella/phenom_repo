# Registry of engineering repos to clone into this workspace.
#
# Add one entry per repo. `path` is relative to `Phenom - Engineering/repos/`
# and must match a folder from index/taxonomy.md.
#
# Fields:
#   name    (required) — Bitbucket repo slug
#   url     (required) — clone URL (SSH)
#   path    (required) — target folder under repos/
#   branch  (optional) — checkout this branch instead of the remote default.
#                        Required whenever the default branch is a stub or
#                        stale; see SETUP.md for the full list and why.
#
# After adding a repo here, run `./sync-repos.sh` to clone/pull it, then:
#   1. Add a row to ../index/repo-catalog.md
#   2. Add a short entry to the matching domain file in ../index/
#
# Example (uncomment and fill in real values):
#
# - name: crm-ui
#   url: git@github.com:phenom/crm-ui.git
#   path: recruiter-hub/crm-ui
#   branch: develop

