## 3. Your Profile

Your profile tells the copilot who you are so it can tailor output without you repeating yourself every session. It should cover:

- **Role and team** — what you do and who you work with
- **Products and Jira projects** — the areas you work in most (this also picks an engineering `--only` filter in section 4)
- **Google Drive folder** — a default folder for ad hoc documents
- **Working preferences** — output style, conventions, things to avoid

**In the Chrome extension:** go to **Settings → Your Profile** and paste your profile text there.

**In Cursor or Claude Code:** the repo includes a `me.md` file in **Phenom - Product Copilot/02_personal-os/**. This file is already wired into `CLAUDE.md` and is **gitignored** so it stays personal. Edit it directly:

```bash
open "$HOME/Phenom - Product Copilot/02_personal-os/me.md"
```

A filled-out example:

```markdown
## Role
Product Manager on the Scheduling team.

## Teams & Products
- Scheduling (primary), occasional work with CRM
- Jira projects: SCHED, occasionally CRM

## Google Drive
- Default folder for ad hoc documents: product-copilot/

## Notes
- Prefer bullet points and tables over long paragraphs
- Follow jira-story-rules.md when creating stories
- Ask one focused question if something is ambiguous
```

---

## 3b. Personal OS

Every PM has a private vault in `02_personal-os/` next to `01_product-os/` (inbox, context layer, meetings, 1:1s, tasks). The folders and rules come with the repo; everything the PM writes there is **gitignored** and never pushed.

1. From the repo root: `bash 01_product-os/onboarding/setup-personal.sh` (adds the starter files).
2. Then say `set me up`: it follows `02_personal-os/.cursor/rules/System/set-me-up.mdc` and fills the context layer from their calendar, one question at a time.
3. Never stage, commit or copy the PM's own files from `02_personal-os/`.

---

## 4. Engineering context (recommended if you write epics)

Clones are **not** in git. `engineering/index/` is. After Copilot is cloned:

1. **Bitbucket SSH** (hard prerequisite): `ssh -T git@bitbucket.org` should show `logged in as <you>`.
2. Infer a `--only` filter from `me.md` products (do not clone all 76 repos on day one):

| If they work on… | `./engineering/scripts/sync-repos.sh --only` |
|---|---|
| Recruiter Hub / CRM / RX | `recruiter-hub` |
| Hiring manager / HRM | `hrm` |
| Scheduling / Interview Intelligence | `interview` |
| Screening / assessments | `screening` |
| Campaigns / candidate engagement | `candidate-engagement` |
| Automation Engine / CRM automations | `automation` |

3. Run from repo root, e.g. `./engineering/scripts/sync-repos.sh --only interview`.
4. Failed repos are OK — the script continues. Tell them to request Bitbucket access, then `--only <name>`.
5. Full sync is **opt-in**: `./engineering/scripts/sync-repos.sh` (~6 GB).
6. Smoke test: ask *“Using engineering/, where is departmentalization / job visibility enforced?”* A good answer names `crm-commons` and `DepartmentalizationManagerV2.java`. Details: `engineering/SETUP.md`.

**Never** edit, commit, or push anything under `engineering/repos/`.

Day-2: `git pull` for Copilot skills/index; re-run `sync-repos.sh` when they need fresher code (not every chat).

---

## Wrapping up

Once setup is complete, ask the user if they want a quick tour of what the copilot can help them with — agents, skills, ticket triage, and engineering feasibility.

If anything in the setup is unclear or something is not working, use request_clarification to ask the user for more detail before trying to help them troubleshoot.
