## 2. MCP Server Setup

There are two types of MCP servers to configure: the local copilot server and the official third-party servers.

### Local Copilot MCP Server (Google, Snowflake, Vanilla KB)

```bash
cd mcp && npm install && npm run setup
```

This talks to the Cloud Run backend (`https://product-copilot-backend-iarivxijkq-uc.a.run.app`) and walks you through:
- Google OAuth (browser — sign in with your Phenom account)
- Snowflake (browser SSO — just your Phenom email; PAT only via `npm run setup snowflake -- --pat` for headless jobs)
- Vanilla KB (pulled from the backend — no local API key)

Tokens land in `~/.copilot/tokens.json`. Do **not** copy a root `.env` or 1Password OAuth client secrets — those live on the backend. There is no PM-facing `.env.example` for Google/Vanilla.

---

### Design system packages (npm)

Prototypes with the Phenom design system install `@phenom/react-ds` (and Font Awesome Pro) from Phenom's Nexus registry. On the VPN, run `bash 01_product-os/onboarding/setup-npm.sh` from the repo root: it asks for the Nexus credential (hidden) or reads it from a cloned Phenom UI repo's `.npmrc` (`--from <path>`), and writes it to `~/.npmrc`. Never put the credential in this repo. Check with `--check`.

### Official MCP Servers (Atlassian + Figma)

**Atlassian (Jira + Confluence)**

1. Get an API token: [id.atlassian.com → Security → API tokens](https://id.atlassian.com/manage-profile/security/api-tokens)
2. Add to your IDE config:
```json
"atlassian": {
  "command": "npx",
  "args": ["-y", "@modelcontextprotocol/server-atlassian"],
  "env": {
    "ATLASSIAN_SITE_URL": "https://phenompeople.atlassian.net",
    "ATLASSIAN_USER_EMAIL": "your.name@phenom.com",
    "ATLASSIAN_API_TOKEN": "<your-api-token>"
  }
}
```

**Figma**

1. Get a personal access token: Figma → Settings → Security → Personal access tokens
2. Add to your IDE config:
```json
"figma": {
  "command": "npx",
  "args": ["-y", "@figma/mcp-server"],
  "env": {
    "FIGMA_PERSONAL_ACCESS_TOKEN": "<your-pat>"
  }
}
```

---

### Where to put the IDE config

**Cursor** — add all three servers to `.cursor/mcp.json` inside the **Phenom - Product Copilot** repo root (see `README.md` for a full example using `mcp/bin/copilot-mcp.js`).

**Claude Code** — register the local server once: `claude mcp add --scope user phenom-copilot -- node "<Copilot checkout>/mcp/bin/copilot-mcp.js"` (Claude Code reads MCP servers from `~/.claude.json`, not `~/.claude/settings.json`). Never point it at an `npx` package name.

Then run `claude` from inside the Phenom - Product Copilot repo, or add this line to any other repo's `CLAUDE.md`:

```
@/Users/your-name/Phenom - Product Copilot/CLAUDE.md
```

