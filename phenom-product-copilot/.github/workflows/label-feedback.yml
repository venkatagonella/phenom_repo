# Labels a feedback issue with the item it is about (for example skill:prd), read from the
# "Skill or agent" field of the form. The PM OS catalog groups feedback by that label.
name: Label feedback

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const m = body.match(/### Skill or agent\s*\n+`?((?:skill|agent|policy):[a-z0-9-]+)`?/i);
            if (!m) return core.info("No item id in the issue body.");
            const name = m[1].toLowerCase();
            const color = { skill: "1f6feb", agent: "8250df", policy: "1a7f37" }[name.split(":")[0]];
            try {
              await github.rest.issues.getLabel({ ...context.repo, name });
            } catch {
              await github.rest.issues.createLabel({ ...context.repo, name, color, description: "Feedback on this catalog item" });
            }
            await github.rest.issues.addLabels({ ...context.repo, issue_number: context.payload.issue.number, labels: [name, "feedback"] });
            core.info(`Labelled ${name}`);
