# On every pull request: check that each shared item has an owner and a valid status,
# then ask the owners of the changed items to review. The owner request stands in for
# CODEOWNERS enforcement, which GitHub only applies to private repos on a paid plan.
name: Catalog check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Every item has an owner and a status
        run: node 01_product-os/onboarding/build-catalog.mjs --check
      - name: Nothing from a personal vault
        run: |
          # Only 02_personal-os system files may be tracked; anything .gitignore excludes was force-added.
          leaked="$(git ls-files -ci --exclude-standard -- 02_personal-os | head -20)"
          if [ -n "$leaked" ]; then
            echo "::error::This pull request contains personal files from 02_personal-os/ that must stay on the PM's laptop:"
            echo "$leaked"
            echo "Remove them with: git rm -r --cached <file> && git commit"
            exit 1
          fi

  request-owner-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ask the owners of the changed items to review
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const rules = fs.readFileSync(".github/CODEOWNERS", "utf8").split("\n")
              .map((l) => l.trim()).filter((l) => l && !l.startsWith("#"))
              .map((l) => { const [pattern, ...owners] = l.split(/\s+/); return { pattern, owners: owners.map((o) => o.replace(/^@/, "")) }; });
            const matches = (pattern, path) => {
              if (pattern === "*") return true;
              const p = pattern.replace(/^\//, "");
              return p.endsWith("/") ? path.startsWith(p) : path === p;
            };
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, { ...context.repo, pull_number: pr.number });
            const owners = new Set();
            for (const f of files) {
              // Last matching rule wins, as in CODEOWNERS
              const rule = [...rules].reverse().find((r) => matches(r.pattern, f.filename));
              if (rule) rule.owners.forEach((o) => owners.add(o));
            }
            owners.delete(pr.user.login);
            if (owners.size === 0) return core.info("No owners to request.");
            try {
              await github.rest.pulls.requestReviewers({ ...context.repo, pull_number: pr.number, reviewers: [...owners] });
              core.info(`Requested review from ${[...owners].join(", ")}`);
            } catch (e) {
              core.warning(`Could not request ${[...owners].join(", ")}: ${e.message}. An owner may not be a collaborator yet.`);
            }
