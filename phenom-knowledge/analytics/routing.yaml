    candidates:
      - {repo: crm-dashboard-service, at: "crm-dashboard-service/src/main/java/com/phenompeople/crmdashboardservice/controllers/OverviewController.java:50", provenance: verified}
      - {repo: crm-recruiter-dashboard, at: "crm-recruiter-dashboard/src/app/modules/core/services/dashboard.service.ts:12", provenance: report}
  - match: ["new leads widget", "new leads data"]
    capability: New leads widget
    candidates:
      - {repo: crm-dashboard-service, at: "crm-dashboard-service/.../controllers/NewLeadsController.java:41", provenance: verified}
  - match: ["new applicants widget"]
