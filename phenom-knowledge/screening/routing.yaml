    db_pattern: "{refNum}_candidates"
    collections: [OnDemandInterviewScreenings, JobSeekerActivity, EventRegistrations, JobsList, EventsSchedule, CandidatesList, OndemandInterviewRawEvent, TenantConfigurations, RecruiterActivities]
  redis: {manager: "crm-video-assessment CRMRedisManager.java:31", dbs: "tenantsList(1), recruiterSettings(7), recruiters(13), tenantConfig(14), general(15)"}
  elasticsearch: {at: "crm-video-assessment ESClientUtil.java:47", note: "index = parentRefNum (lowercased), type = entity collection"}

