# -----------------------------------------------------------------------------
# REPOS
# -----------------------------------------------------------------------------
repos:
  crm-campaigns-ui:
    language: Angular
    role: Email / SMS / WhatsApp campaign builder, subscriptions/autoresponders, campaign reporting.
    mfe: {type: remote, name: crm-campaigns-ui, exposes: "./CampaignsModule", at: "crm-campaigns-ui/webpack.config.js:5"}
    entrypoint: crm-campaigns-ui/src/app/app-routing.module.ts:5
    branch_note: source lives on `development` branch (default branch is empty).

  crm-templates-ui:
    language: Angular
    role: Email + SMS template editor / library / history.
    mfe: {type: remote, name: crm-templates-ui, exposes: "./TemplatesModule + ./SmsTemplatesModule", at: "crm-templates-ui/webpack.config.js:5"}
    entrypoint: crm-templates-ui/src/app/app-routing.module.ts:4
    branch_note: source lives on `development` branch.

  crm-lists-ui:
    language: Angular
    role: Candidate lists (static/dynamic) + talent communities.
    mfe: {type: remote, name: crm-lists-ui, exposes: "./ListsModule + ./TalentCommunitiesModule", at: "crm-lists-ui/webpack.config.js:5"}
    entrypoint: crm-lists-ui/src/app/app-routing.module.ts:4

  crm-inbox-fe:
    language: Angular
    role: Inbox / conversations / threads, WhatsApp campaigns, "messaging everywhere" sidebar, Twilio voice.
    mfe: {type: remote, name: crm-inbox-fe, exposes: "./inbox, ./whatsapp, ./SideBarComponent, ./CandidateContainerComponent, ./VoiceCallBarComponent", at: "crm-inbox-fe/webpack.config.js:21"}
    entrypoint: crm-inbox-fe/src/app/app-routing.module.ts:8

  crm-notes-ui:
    language: Angular
    role: Candidate notes (list, add/edit dialog, feature-embedded notes widget).
    mfe: {type: remote, name: crm-notes, exposes: "./NotesModule + dialog/components", at: "crm-notes-ui/webpack.config.js:8"}
    entrypoint: crm-notes-ui/src/app/app-routing.module.ts:4

  crm-messaging-platform:
    language: Java (Spring Boot, multi-module Maven)
    role: >
      The messaging BACKEND platform. Multi-module: gateway (MGW), email facade/api,
      email analytics/webhooks, text (SMS) api, campaign services, txn email, ops.
    modules_dir: crm-messaging-platform/<module>
    note: no single main class; each module is a deployable service.

  crm-candidate-lists:
    language: Java (Play Framework 2.8 + Guice)
    role: Lists BACKEND — static/dynamic list CRUD, membership, campaign targeting, opt-in/out.
    note: Play Framework (routes file), NOT Spring Boot.

  storm-campaign:
    language: Java (Apache Storm)
    role: Campaign EXECUTION engine — schedules & sends email/SMS campaign touches (drip, autoresponder, bulk).
    entrypoint: storm-campaign/topology (EmailCampaignsTopology.java:42 etc.)

