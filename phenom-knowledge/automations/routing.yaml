# =============================================================================
# Phenom Knowledge Framework — ROUTING file
# Area: Automations (CRM Automations / Recipes)
# =============================================================================
# PURPOSE
#   Maps a natural-language question/intent to the EXACT place in code
#   (repo -> file -> symbol -> line) so answers can be given from real code,
#   not guesses. Every `at:` reference is <repo>/<path>:<line> and was read
#   from the cloned source under MyLocalCRM/repos/.
#
# HOW TO USE
#   1. Match the user question to an `intents[].match` entry (or a capability).
#   2. Open the `at:` target(s) to read the real method/procedure.
#   3. If several repos can satisfy the intent, ALL are listed under
#      `candidates:` — answer per repo-area path, do not pick silently.
#
# PROVENANCE
#   verified: line read directly this session (grep/Read).
#   report:   from a code-reading sub-agent pass (read, but line not re-verified here).
#   Anything not in code is marked `grounded: false` and must not be asserted.
# =============================================================================

area: automations
version: 1
generated: 2026-07-13
clone_root: /Users/venkata.gonella/phenom_repo/MyLocalCRM/repos

# -----------------------------------------------------------------------------
# REPOS in this area
# -----------------------------------------------------------------------------
repos:
  crm-automations-ui:
    language: TypeScript (Angular 16)
    role: >
      Front-end recipe builder MFE. Where recruiters create/edit automation
      recipes (trigger + conditions + actions), browse templates, view run
      history and analytics.
    mfe:
      type: module-federation remote
      remote_name: crmAutomations
      exposes: "./automations -> AutomationsModule"
      at: crm-automations-ui/webpack.config.js:3
    entrypoint: crm-automations-ui/src/app/app-routing.module.ts:17

  crm-automation-service:
    language: Java (Spring Boot, Maven)
    role: >
      Core automation backend. Recipe CRUD, templates, analytics, user
      settings, metadata (trigger/action config), migration, internal jobs,
      and a set of Temporal ACTION activities (forward to HM, video
      assessment, initiate screening, ODVA, invite for interview,
      notification, audit log).
    entrypoint: crm-automation-service/src/main/java/com/phenom (controllers/*)

  automation-search-service:
    language: Java (Spring Boot, Maven)
    role: >
      Trigger-to-recipe MATCHING engine. On a trigger event, uses a Lucene
      "projected filter" index + Elasticsearch to find which recipes match,
      validates filter conditions, and records results. This decides WHICH
      recipes fire.
    entrypoint: automation-search-service/src/main/java/com/phenom/AutomationSearchService.java:23

  candidate-automation:
    language: Java (Apache Storm topology, Maven)
    role: >
      The ACTION EXECUTION engine (Storm). Consumes trigger events, runs
      Trigger -> Filter -> Action bolts, and executes the concrete action via
      an ActionFactory dispatch to 24 action implementations (send email/sms,
      add tag, assign to job/project, change status/stage, screening, ODVA...).
    entrypoint: candidate-automation/src/main/java/com/phenompeople/topology/CPAutomationTopology.java

  crm-workflows:
    language: Java (Spring Boot, Maven)
    role: >
      LinkedIn CRM Connect integration microservice (NOT a general automations
      engine despite the name). Consumes CRM entity-change Kafka events and
      drives LinkedIn API sync (resume upload, interactions, project/candidate
      sync) via the Phenom internal workflow broker.
    naming_note: >
      Name is misleading; functionally this is `crm-linkedin-integration`.
    entrypoint: crm-workflows/src/main/java/com/phenom/crmworkflows/CrmWorkflowsApplication.java:41

  crm-automation:
    language: Python / Robot Framework / Playwright
    role: >
      QA TEST automation (Playwright, Robot Framework RF_*, API perf, Kafka
      event validator). NOT product code. Excluded from the functional graph.
    product_code: false
    at: crm-automation/README.md:1

# -----------------------------------------------------------------------------
# END-TO-END RUNTIME FLOW  (how an automation actually fires)
# Use this to answer "what happens when ... " questions.
# -----------------------------------------------------------------------------
runtime_flow:
  steps:
  - step: 1_author
    what: Recruiter builds/saves a recipe in the UI.
    at: crm-automations-ui/src/app/modules/automation-create/edit-automation/edit-automation.component.ts:1
    calls: crm-automations-ui/src/app/services/automations.service.ts:65   # createRecipe
  - step: 2_persist
    what: Backend creates/updates recipe, persists to Mongo RecipeList and builds MergedFilters.
    at: crm-automation-service/src/main/java/com/phenom/controllers/AutomationController.java:104  # /recipe/create
    also: crm-automation-service/src/main/java/com/phenom/controllers/AutomationController.java:264 # /recipe/update
  - step: 3_trigger_event
    what: A CRM entity change publishes a trigger event onto Kafka.
    topics: [cp_automation_online_trigger, cp_automation_trigger, cp_temporal_automation_online_trigger, cp_temporal_automation_trigger]
  - step: 4_match
    what: Search service finds which recipes match the trigger (Lucene projected filter + ES + validate).
    at: automation-search-service/src/main/java/com/phenom/kafka/KafkaConsumer.java:58   # onlineTrigger
    then: automation-search-service/src/main/java/com/phenom/service/ValidatorService.java:67  # validateFilters
  - step: 5_execute_storm
    what: Storm topology executes matched actions (Trigger->Filter->Action bolts -> ActionFactory).
    at: candidate-automation/src/main/java/com/phenompeople/action/factory/ActionFactory.java:24
  - step: 5_execute_temporal
    what: >
      A subset of actions execute as Temporal activities in the backend
      service instead of Storm (forward-to-HM, video assessment, initiate
      screening, ODVA, invite for interview, notification, audit).
    at: crm-automation-service/src/main/java/com/phenom/temporal/TemporalWorker.java:65
  - step: 6_downstream
    what: Action impls call downstream services (email/sms campaign, lists, tags, jobs, projects, screening...).
    at: candidate-automation/src/main/java/com/phenompeople/action/impl   # per-action classes
  ambiguity_note: >-
    Two action-execution engines coexist: Storm (candidate-automation, 24
    actions) and Temporal (crm-automation-service, ~9 activities). Which path a
    given action takes is data/feature-flag driven (e.g. `automationBatchWorkflow`
    checked in automation-search-service KafkaConsumer). When answering "how is
    action X executed", check BOTH engines and say which implements it.

