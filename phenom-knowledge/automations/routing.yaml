  postgres:
    used_by: [crm-automation-service]
    note: metrics JPA models (com/phenom/dao/jpa/metrics_model)
  redis:
    used_by: [crm-automation-service, automation-search-service]
    note: locks, pub/sub (recipe_delta_changes), filter result buckets
  lucene:
    used_by: [automation-search-service]
    path: /tmp/crm-automation-projected-filter-index
  elasticsearch:
    used_by: [automation-search-service]
    via: EsHttpClientWrapper (shared lib)

# -----------------------------------------------------------------------------
# SHARED LIBRARY (not in these repos) — flagged so we never guess its internals
# -----------------------------------------------------------------------------
external_shared_lib:
  name: com.phenompeople.crm / phenompeople-crm-common
  provides:
    - TaskQueueConstants (Temporal task-queue key literals)
    - CRMAutomationUtils.raiseAutomationEvent (trigger matching + recipe fan-out)
    - TemporalClient, MongoDbUtils, Redis pub/sub plumbing
  grounded: false
  note: >
    Referenced by crm-automation-service & automation-search-service but source
    is NOT cloned. Do not assert its internal behavior; flag as pending-clone.
