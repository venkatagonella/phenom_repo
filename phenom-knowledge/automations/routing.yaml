# -----------------------------------------------------------------------------
# ACTION CATALOG  (candidate-automation Storm engine)
# actionId (literal) -> implementation class. Dispatch is ActionFactory switch.
# All action classes live in:
#   candidate-automation/src/main/java/com/phenompeople/action/impl/<Class>.java
# and implement Action (prepareRequestObject + process):
#   candidate-automation/src/main/java/com/phenompeople/action/Action.java:15
# actionId literals defined in:
#   candidate-automation/src/main/java/com/phenompeople/action/ActionIdConstant.java
# provenance: verified (factory switch + impl file list + constants read this session)
# -----------------------------------------------------------------------------
action_catalog:
  registry_at: candidate-automation/src/main/java/com/phenompeople/action/factory/ActionFactory.java:24
  actions:
    - id: ADD_TAG
      impl: AddCandidateToTag
      factory_line: 30
      does: Add a PH tag to the candidate.
    - id: ADD_NOTE
      impl: AddCandidateToNote
      factory_line: 27
      does: (STUB) registered but unimplemented - prepareRequestObject/process return null; no-ops at runtime.
      grounded_warning: true
    - id: ADD_TASK
      impl: AddTask
      factory_line: 33
      does: Create a task/reminder for the candidate.
    - id: ADD_TO_JTC
      impl: JTCSubscribe
      factory_line: 36
      does: Subscribe candidate to Jobs-That-Change (JTC) job alerts.
    - id: ADD_TO_LIST
      impl: AddCandidateToList
      factory_line: 39
      does: Add candidate to a CRM list.
    - id: ASSIGN_TO_JOB
      impl: AssignToJob
      factory_line: 42
      does: Assign/associate candidate to a job.
    - id: CAMPAIGN_OPT_OUT
      impl: OptOutOfCampaign
      factory_line: 45
      does: Opt candidate out of a campaign.
    - id: FORWARD_PROFILE
      impl: ForwardProfile
      factory_line: 48
      does: Forward a candidate profile (e.g. to another user).
    - id: REMOVE_FROM_LIST
      impl: RemoveFromList
      factory_line: 51
      does: Remove candidate from a CRM list.
    - id: SEND_EMAIL
      impl: SendEmail
      factory_line: 54
      does: Send an email to the candidate (via ecampaign).
    - id: SEND_SMS
      impl: SendSMS
      factory_line: 57
      does: Send an SMS to the candidate.
    - id: CHANGE_HIRING_STATUS
      impl: ChangeHiringStatus
      factory_line: 60
      does: Change the candidate hiring status.
    - id: SIMILAR_JOB_SUBSCRIPTION
      impl: SimilarJobSubscribe
      factory_line: 63
      does: Subscribe candidate to similar-job alerts (shares endpoint w/ JTC, different payload).
    - id: UPDATE_ADDITIONAL_FIELD
      impl: UpdateAdditionalField
      factory_line: 66
      does: Update a custom/additional field. Multiple in one step are merged before dispatch.
    - id: ADD_TO_CAMPAIGN
      impl: AddCandidateToCampaign
      factory_line: 69
      does: Add candidate to a campaign.
    - id: INITIATE_SCREENING
      impl: InitiateScreening
      factory_line: 72
      does: Initiate screening; only action that reads Mongo (customers_info) directly.
    - id: SEND_ODVA
      impl: SendODVA
      factory_line: 75
      does: Send On-Demand Video Assessment invite.
    - id: ASSIGN_TO_PROJECT
      impl: AssignCandidatesToProject
      factory_line: 78
      does: Assign candidate(s) to a project.
    - id: CHANGE_PROJECT_STAGE
      impl: ChangeProjectStage
      factory_line: 81
      does: Move candidate to a different project stage.
    - id: REMOVE_FROM_PROJECT
      impl: RemoveFromProject
      factory_line: 84
      does: Remove candidate from a project.
    - id: CONTACT_CANDIDATE
      impl: ContactCandidate
      factory_line: 87
      does: Composite - routes to SendEmail and/or SendSMS by candidate preferredCommunicationMode.
    - id: FORWARD_CANDIDATE_TO_HIRING_MANAGER
      impl: ForwardCandidateToHiringManager
      factory_line: 90
      does: Forward candidate to hiring manager.
    - id: DO_NOTHING
      impl: DoNothing
      factory_line: 93
      does: No-op placeholder action.
    - id: FORWARD_VIDEO_ASSESSMENT_TO_HIRING_MANAGER
      impl: ForwardVideoAssessmentToHiringManager
      factory_line: 96
      does: Forward a completed video assessment to hiring manager.

