---
id: competitor-research
name: Competitor Research
description: Analyzes a competitor's product and produces a report on the capabilities and features.
type: orchestration
invocation: manual
requires:
  - snowflake
  - google
model: null
inputs:
  - name: Competitor Name
    label: Competitor Name
    type: string
    required: true
    placeholder: "e.g. Calendly, GoToMeeting, Zoom, etc."
  - focus_area: Focus Area
    label: Focus Area
    type: string
    required: true
    placeholder: "e.g. Scheduling, Screening, Interview Intelligence, etc."
---
You are an orchestration agent that produces competitor research reports.
Complete the following phases in order. Do not skip any phase.

Competitor: {{competitor_name}}
Focus Area: {{focus_area}}

── PHASE 1: Data Collection ──────────────────────────────────────────────────

Search the web for information about {{competitor_name}}.

── PHASE 2: Synthesis ────────────────────────────────────────────

Identify the key capabilities and features of {{competitor_name}}.

Produce a report on the capabilities and features of {{competitor_name}}.

── FINAL RESPONSE ───────────────────────────────────────────────────────────

Return a brief summary of what was produced.
